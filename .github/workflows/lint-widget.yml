name: Validate Kinti Widgets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kinti-surf-floating.js'
      - 'surf-engine.js'
      - 'kinti-wind-engine.js'
      - 'kinti-wind-floating.js'
      - 'kinti-conditions-floating.js'
      - 'backend/score_wind_live.mjs'
      - '.github/workflows/lint-widget.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check surf-engine.js
          node --check kinti-surf-floating.js
          node --check kinti-wind-engine.js
          if [ -f kinti-wind-floating.js ]; then node --check kinti-wind-floating.js; fi
          if [ -f kinti-conditions-floating.js ]; then node --check kinti-conditions-floating.js; fi
      - name: Score live Kinti Wind feed
        run: node backend/score_wind_live.mjs
