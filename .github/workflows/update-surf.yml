name: Update Kinti Surf

on:
  # Refresh source forecasts every 3 hours. The public floating widget itself
  # re-reads the generated JSON every hour, so visitors get an hourly refresh
  # without hammering NOAA NOMADS with ~25 GRIB requests every hour.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  # Also publish immediately when the data pipeline/configuration changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-surf.yml'
      - 'backend/update_surf.py'
      - 'backend/providers/**'
      - 'backend/config.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build surf data
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python backend/update_surf.py
      - name: Commit changed forecast
        run: |
          git config user.name "kinti-surf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/surf-data.json
          git diff --cached --quiet || git commit -m "chore: update surf forecast"
          git push
