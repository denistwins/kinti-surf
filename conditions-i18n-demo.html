<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kinti Conditions · ES/EN demo</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#eee8dc;color:#182b2c}
    .hero{min-height:100vh;padding:72px 7vw;display:grid;align-content:center;background:linear-gradient(135deg,#f7f2e8,#ddd3c1)}
    .switch{position:fixed;top:20px;right:20px;z-index:20;display:flex;gap:6px;padding:5px;border-radius:999px;background:#fff}
    .switch button{border:0;border-radius:999px;padding:8px 13px;cursor:pointer}
    .hero p{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:#6c7772}
    .hero h1{font:500 clamp(54px,8vw,110px)/.95 Georgia,serif;margin:14px 0;max-width:900px;letter-spacing:-.04em}
  </style>
</head>
<body>
  <div class="switch"><button onclick="document.documentElement.lang='es'">ES</button><button onclick="document.documentElement.lang='en'">EN</button></div>
  <main class="hero"><p>Kinti · Máncora</p><h1>Widget bilingüe.</h1><p>Cambia ES / EN arriba a la derecha. El widget debe cambiar sin recargar.</p></main>
  <kinti-conditions-floating-v2></kinti-conditions-floating-v2>
  <script type="module" src="./kinti-conditions-floating-v2.js"></script>
</body>
</html>
